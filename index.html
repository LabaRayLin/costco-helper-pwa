<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>COSTCO 助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e31837">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { 
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
        .selected { border-color: #ef4444 !important; background-color: #fef2f2 !important; }
        .check-icon { position: absolute; top: 10px; right: 10px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
        .animate-pulse-soft { animation: pulse-soft 2s infinite; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-32">
    <!-- 頂部標題與搜尋 -->
    <header class="bg-[#e31837] p-6 pb-8 sticky top-0 z-40 shadow-xl rounded-b-[2.5rem]">
        <div class="max-w-md mx-auto flex justify-between items-center mb-6">
            <h1 class="text-white text-3xl font-black flex items-center gap-3 tracking-tighter">
                <svg width="36" height="36" fill="white" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                COSTCO 助手
            </h1>
            <div class="flex flex-col items-end gap-1">
                <button id="refreshBtn" class="bg-white/20 hover:bg-white/30 text-white p-3 rounded-2xl backdrop-blur-md transition-all active:rotate-180 duration-500 shadow-inner group">
                    <svg id="refreshIcon" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
                <span id="updatedTime" class="text-[10px] text-white/50 font-bold">尚未更新</span>
            </div>
        </div>

        <!-- 更新提示 -->
        <div id="toast" class="fixed top-24 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-2 rounded-full text-xs font-bold shadow-2xl opacity-0 transition-all z-50 pointer-events-none">更新成功！</div>

        <!-- 搜尋欄 -->
        <div class="max-w-md mx-auto mt-4 relative">
            <input type="text" id="searchInput" placeholder="搜尋商品名稱或代碼..." 
                   class="w-full bg-white/20 border-none rounded-xl py-3 px-11 text-white placeholder-white/60 focus:bg-white/30 focus:ring-2 focus:ring-white/50 transition-all outline-none">
            <svg class="absolute left-4 top-3.5 text-white/60" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <button id="clearSearch" class="absolute right-3 top-3 bg-white/10 hover:bg-white/20 p-1 rounded-md text-white/60 hidden">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <!-- 分頁切換 -->
        <div class="flex max-w-md mx-auto mt-4 font-bold text-sm bg-white/10 rounded-xl overflow-hidden p-1">
            <button id="tabOffers" class="flex-1 py-2 rounded-lg bg-white text-[#e31837] shadow-sm transition-all">所有商品</button>
            <button id="tabFavs" class="flex-1 py-2 rounded-lg transition-all text-white/80 hover:bg-white/10">我的常購</button>
        </div>
    </header>

    <!-- 所有商品分頁 -->
    <section id="viewOffers" class="p-4 max-w-md mx-auto">
        <div id="status" class="flex flex-col items-center justify-center p-20 gap-4">
            <div class="w-12 h-12 border-4 border-slate-200 border-t-red-600 rounded-full animate-spin"></div>
            <p class="text-slate-500 font-medium">載入中...</p>
        </div>
        <div id="searchExternalTip" class="hidden mb-6 p-5 bg-gradient-to-br from-red-50 to-white rounded-3xl border border-red-100 shadow-sm">
            <p class="text-slate-600 text-sm mb-3 font-medium">在資料庫中找不到「<span id="searchKeywordText" class="text-red-600 font-bold"></span>」</p>
            <button id="searchOnlineBtn" class="w-full bg-slate-800 text-white py-3 rounded-2xl font-bold flex items-center justify-center gap-2 active:scale-[0.98] transition-all">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                前往好市多官網搜尋
            </button>
        </div>
        <div id="offersList" class="grid grid-cols-2 gap-4"></div>
    </section>

    <!-- 我的常購分頁 -->
    <section id="viewFavs" class="hidden p-4 max-w-md mx-auto">
        <div id="favsList" class="flex flex-col gap-6"></div>
    </section>

    <!-- 底部懸浮分享按鈕 -->
    <div id="shareBar" class="fixed bottom-0 left-0 right-0 p-5 bg-white/95 backdrop-blur-md border-t border-slate-100 shadow-[0_-10px_40px_rgba(0,0,0,0.15)] transform translate-y-full transition-all duration-500 ease-out z-50 rounded-t-[2.5rem]">
        <div class="max-w-md mx-auto">
            <!-- 展開清單區域 -->
            <div id="selectedItemsPreview" class="hidden mb-6 max-h-[60vh] overflow-y-auto custom-scrollbar">
                <div class="flex justify-between items-center mb-4 sticky top-0 bg-white/10 backdrop-blur-sm py-2">
                    <h3 class="font-black text-slate-800 text-lg">清單預覽</h3>
                    <button id="closePreviewBtn" class="text-slate-400 hover:text-slate-600">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                </div>
                <div id="previewList" class="space-y-3"></div>
            </div>

            <!-- 摘要區域 -->
            <div class="flex justify-between items-center">
                <div id="openPreviewBtn" class="flex items-center gap-4 cursor-pointer group">
                    <div class="flex flex-col">
                        <span id="selectedCount" class="font-black text-2xl text-red-600">0</span>
                        <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest group-hover:text-red-500 transition-colors">查看清單詳情</span>
                    </div>
                    <button id="clearSelectionBtn" class="text-slate-400 hover:text-red-600 transition-all p-2 bg-slate-100 rounded-xl" title="清空選擇">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
                <button id="shareBtn" class="bg-green-500 hover:bg-green-600 text-white px-8 py-3 rounded-2xl font-black shadow-lg transition-all active:scale-95 flex items-center gap-2">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
                    傳送清單
                </button>
            </div>
        </div>
    </div>

    <script>
        // 我的常購清單：優先使用商品編號記錄 (去除了前導 0)
        let favoriteKeys = JSON.parse(localStorage.getItem('costco_favs_keys')) || [
            "205134", "118583", "90768", "2255551", "128968", "126249", "69536", "91111", "145424", "126917", 
            "577908", "3961", "289390", "866578", "41033", "98589", "86456", "110972", "108994", "153418", 
            "110971", "855679", "599369", "639271", "886466", "154204", "744110", "100531", "50021", 
            "139234", "150879", "200762", "1881606", "122672", "111887"
        ];

        // 自動清理：將舊有的帶 0 編號統一轉換為去 0 版本
        favoriteKeys = favoriteKeys.map(k => (typeof k === 'string' && /^\d+$/.test(k)) ? k.replace(/^0+/, '') : k);
        favoriteKeys = [...new Set(favoriteKeys)]; // 去重

        function saveFavs() {
            localStorage.setItem('costco_favs_keys', JSON.stringify(favoriteKeys));
        }

        let selectedItems = new Set();
        let allOffers = [];
        let allOffersMap = new Map();
        let currentTab = 'offers';
        let searchQuery = '';
        let displayCount = 50;
        const BATCH_SIZE = 50;

        // 切換分頁
        function switchTab(tab) {
            currentTab = tab;
            const btnOffers = document.getElementById('tabOffers');
            const btnFavs = document.getElementById('tabFavs');
            const viewOffers = document.getElementById('viewOffers');
            const viewFavs = document.getElementById('viewFavs');

            if (tab === 'offers') {
                btnOffers.className = "flex-1 py-2 rounded-lg bg-white text-[#e31837] shadow-sm transition-all";
                btnFavs.className = "flex-1 py-2 rounded-lg transition-all text-white/80 hover:bg-white/10";
                viewOffers.classList.remove('hidden');
                viewFavs.classList.add('hidden');
                document.getElementById('searchExternalTip').classList.toggle('hidden', searchQuery === '');
            } else {
                btnFavs.className = "flex-1 py-2 rounded-lg bg-white text-[#e31837] shadow-sm transition-all";
                btnOffers.className = "flex-1 py-2 rounded-lg transition-all text-white/80 hover:bg-white/10";
                viewFavs.classList.remove('hidden');
                viewOffers.classList.add('hidden');
                document.getElementById('searchExternalTip').classList.add('hidden');
                renderFavorites();
            }
        }

        // 載入資料
        async function fetchData() {
            const status = document.getElementById('status');
            const offersList = document.getElementById('offersList');
            const refreshBtn = document.getElementById('refreshBtn');
            const refreshIcon = document.getElementById('refreshIcon');
            const updatedTime = document.getElementById('updatedTime');
            const toast = document.getElementById('toast');
            
            refreshBtn.disabled = true;
            refreshIcon.classList.add('animate-spin');
            offersList.classList.add('opacity-40');
            status.style.display = 'flex';

            try {
                const response = await fetch(`./data.json?_=${Date.now()}`);
                if (!response.ok) throw new Error('資料未更新');
                const data = await response.json();
                allOffers = data.items || [];
                
                // 建立快速查詢索引 (支援編號與名稱，編號統一去除前導 0)
                allOffersMap.clear();
                allOffers.forEach(item => {
                    if (item.code) {
                        const cleanCode = item.code.replace(/^0+/, '');
                        allOffersMap.set(cleanCode, item);
                    }
                    if (item.name) allOffersMap.set(item.name, item);
                });
                
                renderOffers();
                
                // 更新時間顯示
                if (data.updated_at) {
                    updatedTime.innerText = `最後更新: ${data.updated_at}`;
                }
                
                status.style.display = 'none';

                // 顯示成功提示
                toast.classList.replace('opacity-0', 'opacity-100');
                setTimeout(() => toast.classList.replace('opacity-100', 'opacity-0'), 2000);

            } catch (err) {
                status.innerHTML = `<p class="text-red-500 text-xs">資料載入失敗，請稍後再試</p>`;
            } finally {
                refreshBtn.disabled = false;
                refreshIcon.classList.remove('animate-spin');
                offersList.classList.remove('opacity-40');
            }
        }

        // 渲染商品列表
        function renderOffers(isAppend = false) {
            const list = document.getElementById('offersList');
            const tip = document.getElementById('searchExternalTip');
            const keywordText = document.getElementById('searchKeywordText');
            
            const filtered = allOffers
                .filter(item => {
                    const cleanCode = item.code ? item.code.replace(/^0+/, '') : '';
                    return item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                           cleanCode.includes(searchQuery);
                })
                .sort((a, b) => {
                    const hasA = a.discount && a.original_price ? 1 : 0;
                    const hasB = b.discount && b.original_price ? 1 : 0;
                    return hasB - hasA;
                });

            if (!isAppend) {
                list.innerHTML = '';
                displayCount = BATCH_SIZE;
            }
            
            if (searchQuery && filtered.length === 0) {
                tip.classList.remove('hidden');
                keywordText.innerText = searchQuery;
            } else {
                tip.classList.add('hidden');
            }

            const itemsToRender = filtered.slice(isAppend ? displayCount - BATCH_SIZE : 0, displayCount);

            itemsToRender.forEach(item => {
                const card = document.createElement('div');
                card.className = `bg-white p-4 rounded-3xl shadow-sm border-2 border-transparent transition-all active:scale-95 cursor-pointer flex flex-col ${selectedItems.has(item.name) ? 'selected' : ''}`;
                
                const hasDiscount = item.discount && item.original_price;
                const cleanCode = item.code ? item.code.replace(/^0+/, '') : '';
                const isFavorite = favoriteKeys.includes(cleanCode) || favoriteKeys.includes(item.name);

                card.innerHTML = `
                    <div class="relative mb-3 overflow-hidden rounded-2xl bg-slate-50 aspect-square">
                        ${item.img ? `<img src="${item.img}" class="w-full h-full object-contain" loading="lazy">` : `<div class="w-full h-full flex items-center justify-center text-slate-300"><svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg></div>`}
                        ${hasDiscount ? `<div class="absolute top-2 left-2 bg-red-600 text-white text-[10px] font-black px-3 py-1 rounded-full shadow-lg animate-pulse border-2 border-white">SALE</div>` : ''}
                        <button class="fav-toggle absolute top-2 right-2 p-2 bg-white/80 backdrop-blur-sm rounded-full shadow-sm ${isFavorite ? 'text-yellow-500' : 'text-slate-300'}" data-key="${cleanCode || item.name}">
                            <svg width="18" height="18" fill="${isFavorite ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
                        </button>
                    </div>
                    <div class="flex-grow">
                        <div class="text-xs text-slate-400 font-bold mb-1">${cleanCode}</div>
                        <h3 class="font-bold text-slate-800 text-sm leading-snug h-10 line-clamp-2 mb-2">${item.name}</h3>
                        <div class="mt-auto">
                            ${hasDiscount ? `
                                <div class="flex items-baseline gap-2">
                                    <div class="text-red-600 font-black text-xl">${item.price}</div>
                                    <div class="text-[10px] text-slate-300 line-through font-medium">${item.original_price}</div>
                                </div>
                            ` : `
                                <div class="text-slate-800 font-black text-xl">${item.price}</div>
                            `}
                        </div>
                    </div>
                `;
                
                card.onclick = (e) => {
                    if (e.target.closest('.fav-toggle')) {
                        const key = e.target.closest('.fav-toggle').getAttribute('data-key');
                        toggleFavorite(key);
                        return;
                    }
                    toggleItem(item.name, card);
                };
                list.appendChild(card);
            });

            if (displayCount < filtered.length) {
                const sentinel = document.createElement('div');
                sentinel.id = 'loadMoreSentinel';
                sentinel.className = "col-span-2 h-10 flex items-center justify-center text-slate-300";
                sentinel.innerHTML = '<div class="w-5 h-5 border-2 border-slate-200 border-t-slate-400 rounded-full animate-spin"></div>';
                list.appendChild(sentinel);
                setupInfiniteScroll();
            }
        }

        function setupInfiniteScroll() {
            const sentinel = document.getElementById('loadMoreSentinel');
            if (!sentinel) return;
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) {
                    observer.disconnect();
                    sentinel.remove();
                    displayCount += BATCH_SIZE;
                    renderOffers(true);
                }
            }, { rootMargin: '400px' });
            observer.observe(sentinel);
        }

        // 渲染我的常購分頁
        function renderFavorites() {
            const list = document.getElementById('favsList');
            list.innerHTML = ''; 

            const filteredKeys = favoriteKeys.filter(key => {
                const product = allOffersMap.get(key);
                const name = product ? product.name : key;
                return name.toLowerCase().includes(searchQuery.toLowerCase());
            });

            if (filteredKeys.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-20">
                        <div class="text-slate-200 mb-4"><svg class="mx-auto" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg></div>
                        <p class="text-slate-400 font-medium">還沒有收藏項目，從「所有商品」中點擊星星加入吧！</p>
                    </div>
                `;
                return;
            }

            const section = document.createElement('div');
            section.innerHTML = `
                <h3 class="font-black text-lg text-slate-800 mb-4 flex items-center gap-2">
                    <span class="w-1 h-6 bg-red-600 rounded-full"></span> 我的清單 (${filteredKeys.length})
                </h3>
                <div class="grid grid-cols-1 gap-4">
                    ${filteredKeys.map(key => {
                        const product = allOffersMap.get(key);
                        const displayName = product ? product.name : key;
                        const isSelected = selectedItems.has(displayName);
                        return `
                                <div class="fav-item bg-white p-4 rounded-3xl shadow-sm border-2 border-transparent flex gap-4 items-center transition-all active:scale-[0.98] cursor-pointer ${isSelected ? 'selected' : ''}" data-name="${displayName}" data-key="${key}">
                                    <div class="w-16 h-16 bg-slate-50 rounded-2xl flex-shrink-0 overflow-hidden border border-slate-100 relative">
                                        ${product && product.img ? `<img src="${product.img}" class="w-full h-full object-contain" loading="lazy">` : `<div class="w-full h-full flex items-center justify-center text-slate-300"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg></div>`}
                                        ${product && product.discount ? `<div class="absolute top-0 left-0 bg-red-600 text-white text-[8px] font-black px-2 py-1 rounded-br-xl shadow-md animate-pulse border border-white">SALE</div>` : ''}
                                    </div>
                                    <div class="flex-grow">
                                        <div class="text-[10px] text-slate-400 font-bold">${product ? product.code : ''}</div>
                                        <div class="font-bold text-slate-800 text-base leading-tight mb-1 line-clamp-1">${displayName}</div>
                                        <div class="flex items-baseline gap-2">
                                            <div class="text-red-600 font-black text-lg">${product ? product.price : '確認中'}</div>
                                            ${product && product.original_price ? `<div class="text-[10px] text-slate-300 line-through">${product.original_price}</div>` : ''}
                                        </div>
                                    </div>
                                <button class="remove-fav p-2 text-slate-300 hover:text-red-500" data-key="${key}">
                                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                                <div class="check-icon ${isSelected ? 'text-red-600' : 'text-slate-100'}">
                                    <svg width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
            list.appendChild(section);

            // 為常購項目綁定點擊事件
            document.querySelectorAll('.fav-item').forEach(el => {
                el.onclick = (e) => {
                    const name = el.getAttribute('data-name');
                    const key = el.getAttribute('data-key');
                    if (e.target.closest('.remove-fav')) {
                        toggleFavorite(key);
                        return;
                    }
                    toggleItem(name, el);
                    const icon = el.querySelector('.check-icon');
                    if (selectedItems.has(name)) {
                        icon.classList.replace('text-slate-100', 'text-red-600');
                    } else {
                        icon.classList.replace('text-red-600', 'text-slate-100');
                    }
                };
            });
        }

        function toggleFavorite(key) {
            const index = favoriteKeys.indexOf(key);
            if (index > -1) {
                favoriteKeys.splice(index, 1);
            } else {
                favoriteKeys.push(key);
            }
            saveFavs();
            if (currentTab === 'offers') renderOffers(false);
            else renderFavorites();
        }

        // 搜尋邏輯
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearSearch');

        searchInput.oninput = (e) => {
            searchQuery = e.target.value.trim();
            clearBtn.classList.toggle('hidden', searchQuery === '');
            if (currentTab === 'offers') renderOffers();
            else renderFavorites();
        };

        clearBtn.onclick = () => {
            searchInput.value = '';
            searchQuery = '';
            clearBtn.classList.add('hidden');
            if (currentTab === 'offers') renderOffers();
            else renderFavorites();
        };

        document.getElementById('searchOnlineBtn').onclick = () => {
            const url = `https://www.costco.com.tw/search?text=${encodeURIComponent(searchQuery)}`;
            window.open(url, '_blank');
        };

        function toggleItem(name, element) {
            if (selectedItems.has(name)) {
                selectedItems.delete(name);
                element.classList.remove('selected');
            } else {
                selectedItems.add(name);
                element.classList.add('selected');
                if (window.navigator.vibrate) window.navigator.vibrate(20);
            }
            updateShareBar();
        }

        function updateShareBar() {
            const bar = document.getElementById('shareBar');
            const countLabel = document.getElementById('selectedCount');
            countLabel.innerText = selectedItems.size;
            if (selectedItems.size > 0) {
                bar.classList.remove('translate-y-full');
                updatePreviewList();
            } else {
                bar.classList.add('translate-y-full');
                document.getElementById('selectedItemsPreview').classList.add('hidden');
            }
        }

        function updatePreviewList() {
            const list = document.getElementById('previewList');
            list.innerHTML = '';
            selectedItems.forEach(name => {
                const product = allOffersMap.get(name);
                const item = document.createElement('div');
                item.className = "flex items-center gap-3 bg-slate-50 p-3 rounded-2xl";
                item.innerHTML = `
                    <div class="w-10 h-10 bg-white rounded-lg flex-shrink-0 overflow-hidden border border-slate-100">
                        ${product && product.img ? `<img src="${product.img}" class="w-full h-full object-contain">` : ''}
                    </div>
                    <div class="flex-grow">
                        <div class="text-xs font-bold text-slate-700 line-clamp-1">${name}</div>
                        <div class="text-[10px] text-red-600 font-black">${product ? product.price : ''}</div>
                    </div>
                    <button class="remove-preview-item text-slate-300 hover:text-red-500" data-name="${name}">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                `;
                item.querySelector('.remove-preview-item').onclick = () => {
                    selectedItems.delete(name);
                    const card = document.querySelector(`[data-name="${name}"]`);
                    if (card) {
                        card.classList.remove('selected');
                        const icon = card.querySelector('.check-icon');
                        if (icon) icon.classList.replace('text-red-600', 'text-slate-100');
                    }
                    updateShareBar();
                };
                list.appendChild(item);
            });
        }

        document.getElementById('openPreviewBtn').onclick = () => {
            const preview = document.getElementById('selectedItemsPreview');
            preview.classList.toggle('hidden');
        };

        document.getElementById('closePreviewBtn').onclick = () => {
            document.getElementById('selectedItemsPreview').classList.add('hidden');
        };

        document.getElementById('shareBtn').onclick = async () => {
            const list = Array.from(selectedItems).map((item, i) => `${i+1}. ${item}`).join('\n');
            const text = `🛒 我的好市多清單：\n${list}`;
            if (navigator.share) {
                try {
                    await navigator.share({ title: 'Costco 購物清單', text: text });
                } catch (err) {}
            } else {
                await navigator.clipboard.writeText(text);
                alert('清單已複製到剪貼簿！');
            }
        };

        document.getElementById('clearSelectionBtn').onclick = () => {
            if (selectedItems.size === 0) return;
            if (confirm('確定要清空已選擇的項目嗎？')) {
                selectedItems.clear();
                document.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
                document.querySelectorAll('.check-icon').forEach(el => el.classList.replace('text-red-600', 'text-slate-100'));
                updateShareBar();
            }
        };

        document.getElementById('tabOffers').onclick = () => switchTab('offers');
        document.getElementById('tabFavs').onclick = () => switchTab('favs');
        document.getElementById('refreshBtn').onclick = () => fetchData();

        fetchData();
    </script>
</body>
</html>
