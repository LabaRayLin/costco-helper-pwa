<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>好市多優惠助手</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto+Sans+TC', sans-serif;
        }
        
        .selected { 
            border: 3px solid #ef4444 !important; 
            background-color: #fff1f2;
            transform: scale(1.02);
        }
        
        .product-img { 
            aspect-ratio: 1 / 1; 
            object-fit: contain; 
            mix-blend-mode: multiply;
        }

        /* 骨架屏動畫 */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-24">
    <header class="bg-[#e31837] text-white p-4 sticky top-0 z-50 shadow-lg">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div class="flex items-center gap-2">
                <div class="bg-white p-1 rounded-md">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="#e31837"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                </div>
                <h1 class="font-black text-xl tracking-tight">COSTCO 優惠助手</h1>
            </div>
            <button id="refreshBtn" class="bg-white/20 hover:bg-white/30 backdrop-blur-sm p-2 rounded-full transition-all active:rotate-180">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
        </div>
    </header>

    <!-- 狀態顯示 -->
    <div id="status" class="flex flex-col items-center justify-center p-20 gap-4">
        <div class="w-12 h-12 border-4 border-slate-200 border-t-red-600 rounded-full animate-spin"></div>
        <p class="text-slate-500 font-medium">正在連線至好市多官網...</p>
    </div>
    
    <main id="app" class="p-4 grid grid-cols-2 gap-4 max-w-md mx-auto"></main>

    <!-- 底部懸浮分享按鈕 -->
    <div id="shareBar" class="fixed bottom-0 left-0 right-0 p-5 bg-white/80 backdrop-blur-md border-t border-slate-100 shadow-[0_-10px_30px_rgba(0,0,0,0.05)] transform translate-y-full transition-all duration-500 ease-out z-50 rounded-t-3xl">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex flex-col">
                <span id="selectedCount" class="font-black text-2xl text-red-600">0</span>
                <span class="text-xs text-slate-400 font-bold uppercase tracking-widest">已選擇項目</span>
            </div>
            <button id="shareBtn" class="bg-green-500 hover:bg-green-600 text-white px-10 py-3 rounded-2xl font-black shadow-lg shadow-green-200 transition-all active:scale-95 flex items-center gap-2">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
                傳送清單
            </button>
        </div>
    </div>

    <script>
        let selectedItems = new Set();

        async function fetchData() {
            const status = document.getElementById('status');
            const app = document.getElementById('app');
            const refreshBtn = document.getElementById('refreshBtn');
            
            refreshBtn.disabled = true;
            app.classList.add('opacity-40');
            status.style.display = 'flex';
            status.innerHTML = `
                <div class="w-12 h-12 border-4 border-slate-200 border-t-red-600 rounded-full animate-spin"></div>
                <p class="text-slate-500 font-medium">正在讀取優惠資料...</p>
            `;

            try {
                // 直接讀取倉庫內的 data.json (由 GitHub Actions 定期產出)
                const response = await fetch(`./data.json?_=${Date.now()}`);
                if (!response.ok) throw new Error('資料檔案尚未生成或讀取失敗');

                const data = await response.json();
                const products = data.items || [];

                if (products.length === 0) throw new Error('目前無優惠資料');

                // 顯示最後更新時間
                console.log('資料更新時間:', data.updated_at);
                
                renderProducts(products);
                status.style.display = 'none';
            } catch (err) {
                console.error('讀取失敗:', err.message);
                status.innerHTML = `
                    <div class="text-red-500 bg-red-50 p-6 rounded-2xl text-center max-w-xs mx-auto">
                        <p class="font-bold mb-2">資料讀取失敗</p>
                        <p class="text-[10px] opacity-70 mb-4">${err.message}</p>
                        <p class="text-[10px] mb-4">請確保已推送代碼至 GitHub 並等待 Actions 首次執行完畢。</p>
                        <button onclick="fetchData()" class="bg-red-600 text-white px-6 py-2 rounded-full text-xs font-bold shadow-lg">重試</button>
                    </div>
                `;
            } finally {
                refreshBtn.disabled = false;
                app.classList.remove('opacity-40');
            }
        }

        function renderProducts(products) {
            const app = document.getElementById('app');
            app.innerHTML = '';
            
            products.forEach((item) => {
                const name = item.name || '未知名稱';
                const price = item.price || '點入確認價格';
                const img = item.img || '';

                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-3xl shadow-sm border-2 border-transparent flex flex-col transition-all active:scale-95 cursor-pointer hover:shadow-xl hover:shadow-slate-200 group';
                card.innerHTML = `
                    <div class="relative overflow-hidden rounded-2xl mb-3">
                        <img src="${img}" class="product-img w-full transition-transform duration-500 group-hover:scale-110">
                    </div>
                    <div class="text-[13px] font-bold text-slate-700 line-clamp-2 h-10 mb-2 leading-snug">${name}</div>
                    <div class="mt-auto">
                        <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">優惠價</div>
                        <div class="text-lg font-black text-red-600">${price}</div>
                    </div>
                `;

                const itemKey = `${name} (${price})`;
                if (selectedItems.has(itemKey)) card.classList.add('selected');

                card.onclick = () => {
                    if (selectedItems.has(itemKey)) {
                        selectedItems.delete(itemKey);
                        card.classList.remove('selected');
                    } else {
                        selectedItems.add(itemKey);
                        card.classList.add('selected');
                        if (window.navigator.vibrate) window.navigator.vibrate(20);
                    }
                    updateShareBar();
                };
                app.appendChild(card);
            });
        }

        function updateShareBar() {
            const bar = document.getElementById('shareBar');
            const countLabel = document.getElementById('selectedCount');
            countLabel.innerText = selectedItems.size;
            
            if (selectedItems.size > 0) {
                bar.classList.remove('translate-y-full');
            } else {
                bar.classList.add('translate-y-full');
            }
        }

        document.getElementById('shareBtn').onclick = async () => {
            const list = Array.from(selectedItems).map((item, i) => `${i+1}. ${item}`).join('\n');
            const text = "🛒 好市多優惠挑選清單：\n------------------\n" + list + "\n------------------\n產生時間：" + new Date().toLocaleString();
            
            if (navigator.share) {
                try {
                    await navigator.share({ title: 'Costco 購物清單', text: text });
                } catch (e) { console.log('分享取消'); }
            } else {
                try {
                    await navigator.clipboard.writeText(text);
                    alert('已複製清單！');
                } catch (err) {
                    alert('分享失敗');
                }
            }
        };

        document.getElementById('refreshBtn').onclick = fetchData;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        fetchData();
    </script>
</body>
</html>
